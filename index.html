    </div>
    <div class="bar bar-meta">

      <li><figure class="tile" tabindex="0" style="--tone: #6A6C5A"><img src="assets/work/07-toj.jpg" width="742" height="564" alt="TOJ Nuts &amp; Fruits doypack" loading="lazy"><figcaption><span class="tile-name">TOJ</span><span class="tile-desc" data-i18n="dToj">Packaging for nuts and dried fruit</span></figcaption></figure></li>
